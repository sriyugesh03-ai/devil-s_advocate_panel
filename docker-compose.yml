version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: devils_advocate_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=devils_advocate

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devils_advocate_backend
    restart: unless-stopped
    ports:
      - "8999:8999"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=devils_advocate
      - PORT=8999
      - HOST=0.0.0.0
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devils_advocate_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8999
    depends_on:
      - backend

volumes:
  mongo_data:
